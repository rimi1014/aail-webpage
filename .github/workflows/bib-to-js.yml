name: Update Publications from BibTeX

on:
  push:
    branches: [main]
    paths:
      - 'data/publications.bib'

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Convert BibTeX to JS
        run: python scripts/bib_to_js.py

      - name: Commit updated publications.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.js
          if git diff --staged --quiet; then
            echo "publications.js is already up to date."
          else
            git commit -m "Auto-update publications.js from BibTeX"
            git push
          fi

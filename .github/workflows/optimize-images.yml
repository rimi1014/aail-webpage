name: Optimize Images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Optimize images
        uses: calibreapp/image-actions@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          compress_only: true
          jpg_quality: 82
          png_quality: 82
          webp_quality: 80
